  <a class="skip" href="#plan" data-i18n="skip"></a>
  <aside id="panel" data-i18n-aria="panel.aria">
    <!-- Phone only: the panel is a sheet over the map. This bar shows the route in short and sizes the sheet. -->
    <div class="sheet-bar">
      <button type="button" id="sheetGrab" class="sheet-grab"><span></span></button>
      <div class="sheet-row">
        <p id="summaryText" class="sheet-summary" data-i18n="summary.empty"></p>
        <div class="sheet-size">
          <button type="button" id="sheetLess" class="ghost icon" data-i18n-aria="sheet.less"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-down"/></svg></button>
          <button type="button" id="sheetMore" class="ghost icon" data-i18n-aria="sheet.more"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-up"/></svg></button>
        </div>
      </div>
    </div>

    <header>
      <div class="titlebar">
        <h1><svg class="ic teal big" aria-hidden="true" focusable="false"><use href="#i-scooter"/></svg> <span>Scootmobiel <span translate="no">Hoorn</span></span></h1>
        <button type="button" id="helpBtn" class="ghost help-btn" data-i18n-aria="help.aria"><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-help"/></svg><span data-i18n="help.btn"></span></button>
      </div>
      <p class="sub" data-i18n-html="sub"></p>
      <div class="pickers">
        <label class="stylepick"><span><svg class="ic violet" aria-hidden="true" focusable="false"><use href="#i-palette"/></svg> <span data-i18n="style.label"></span></span>
          <select id="style">
            <option value="liberty" data-i18n="style.liberty"></option>
            <option value="bright" data-i18n="style.bright"></option>
            <option value="positron" data-i18n="style.positron"></option>
            <option value="dark" data-i18n="style.dark"></option>
            <option value="fiord" data-i18n="style.fiord"></option>
            <option value="liberty2d" data-i18n="style.liberty2d"></option>
          </select>
        </label>
      </div>
      <p id="offline" class="offline" hidden data-i18n="offline"></p>
    </header>

    <div id="plan" tabindex="-1">
      <fieldset class="stops">
        <legend><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-route"/></svg> <span data-i18n="stops.legend"></span></legend>
        <div id="stopList"></div>
        <div class="row">
          <button type="button" id="locate" class="ghost"><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg> <span class="lbl" data-i18n="locate"></span></button>
          <button type="button" id="addVia" class="ghost"><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg> <span data-i18n="addVia"></span></button>
          <button type="button" id="swap" class="ghost" data-i18n-aria="swap.aria"><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-swap"/></svg> <span data-i18n="swap"></span></button>
        </div>
        <p class="hint" data-i18n="stops.hint"></p>
      </fieldset>

      <section id="result" aria-labelledby="resultTitle" hidden>
        <h2 id="resultTitle" data-i18n="result.title"></h2>
        <div class="stats" aria-live="polite">
          <div><span id="rDist">–</span><small data-i18n="stat.dist"></small></div>
          <div><span id="rTime">–</span><small data-i18n="stat.time"></small></div>
          <div><span id="rArrive">–</span><small id="rArriveLabel" data-i18n="stat.arrive"></small></div>
        </div>
        <p id="gist" class="gist" aria-live="polite"></p>
        <p id="warn" class="warn" hidden></p>
        <div class="row actions">
          <button type="button" id="speak" class="ghost"><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-speaker"/></svg> <span class="lbl" data-i18n="speak"></span></button>
          <button type="button" id="toilet" class="ghost"><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-toilet"/></svg> <span data-i18n="toilet"></span></button>
          <button type="button" id="share" class="ghost"><svg class="ic violet" aria-hidden="true" focusable="false"><use href="#i-share"/></svg> <span data-i18n="share"></span></button>
        </div>
        <details class="route-more">
          <summary><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-more"/></svg> <span data-i18n="more"></span></summary>
          <div id="mix" class="mix" aria-hidden="true"></div>
          <ul id="mixLegend" class="legend"></ul>
          <p id="weather" class="weather" hidden></p>
          <p id="best" class="best" hidden></p>
          <div id="obstacles" class="obstacles" hidden></div>
          <p id="along" class="along" hidden></p>
          <div class="row">
            <button type="button" id="follow" class="ghost"><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-play"/></svg> <span class="lbl" data-i18n="follow"></span></button>
            <button type="button" id="save" class="ghost"><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-star"/></svg> <span class="lbl" data-i18n="save"></span></button>
          </div>
        </details>
        <details class="route-steps">
          <summary><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-list"/></svg> <span data-i18n="steps.title"></span></summary>
          <ol id="steps"></ol>
        </details>
        <p class="hint" data-i18n="result.hint"></p>
      </section>

      <fieldset class="grid2">
        <legend><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-scooter"/></svg> <span data-i18n="vehicle.legend"></span></legend>
        <label><span data-i18n="vehicle.label"></span>
          <select id="vehicle">
            <option value="klein" data-i18n="vehicle.klein"></option>
            <option value="middel" selected data-i18n="vehicle.middel"></option>
            <option value="groot" data-i18n="vehicle.groot"></option>
          </select>
        </label>
        <label><span data-i18n="profile.label"></span>
          <select id="profile">
            <option value="rustig" data-i18n="profile.rustig"></option>
            <option value="kortst" data-i18n="profile.kortst"></option>
          </select>
        </label>
        <label class="check wide"><input id="retour" type="checkbox" /> <span data-i18n="retour"></span></label>
        <details class="more wide">
          <summary data-i18n="moreSettings"></summary>
          <label class="check"><input id="avoid" type="checkbox" checked /> <span data-i18n="avoid"></span></label>
          <!-- Only shown when the device has both a female and a male voice for this language. -->
          <fieldset id="voiceBox" class="voice" hidden>
            <legend data-i18n="voice.label"></legend>
            <label class="check"><input type="radio" name="voice" value="female" /> <span data-i18n="voice.female"></span></label>
            <label class="check"><input type="radio" name="voice" value="male" /> <span data-i18n="voice.male"></span></label>
          </fieldset>
          <p id="blockedInfo" class="hint" hidden></p>
        </details>
      </fieldset>

      <fieldset>
        <legend><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-compass"/></svg> <span data-i18n="presets.legend"></span></legend>
        <div id="presets" class="chips"></div>
      </fieldset>

      <fieldset id="savedBox" hidden>
        <legend><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-star"/></svg> <span data-i18n="saved.legend"></span></legend>
        <ul id="favList" class="saved"></ul>
        <p id="recentHead" class="minihead" hidden data-i18n="recent"></p>
        <ul id="recentList" class="saved"></ul>
      </fieldset>

      <fieldset>
        <legend><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-map"/></svg> <span data-i18n="layers.legend"></span></legend>
        <div id="poiToggles" class="toggles"></div>
      </fieldset>
    </div>
    <p id="status" class="status" role="status" data-i18n="status.loading"></p>

    <footer>
      <p class="credits" data-i18n="footer.check"></p>
      <!-- Folded away; the required map credit stays visible in the map corner. -->
      <details class="sources">
        <summary><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-info"/></svg> <span data-i18n="sources"></span></summary>
        <p data-i18n-html="sources.text" class="credits"></p>
      </details>
      <div class="made">
        <a class="codelink" href="https://github.com/raimonvibe/scootmobieltocht-hoorn-nl" target="_blank" rel="noopener"><svg class="ic white" aria-hidden="true" focusable="false"><use href="#i-code"/></svg> <span data-i18n="code"></span></a>
        <p><span data-i18n="madeBy"></span> <a href="https://raimonvibe.nl" target="_blank" rel="noopener" title="raimonvibe.nl">Stefan</a> · <span id="copyYear" translate="no">© 2026</span></p>
      </div>
    </footer>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!-- First-visit loading screen; also explains a failed load and offers a retry. -->
  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <svg class="ic teal loading-icon" aria-hidden="true" focusable="false"><use href="#i-scooter"/></svg>
      <p id="loadingText" data-i18n="loading.text"></p>
      <div class="loading-bar" aria-hidden="true"><span></span></div>
      <p class="loading-sub" data-i18n="loading.sub"></p>
      <button type="button" id="loadingRetry" hidden data-i18n="loading.retry"></button>
    </div>
  </div>
  <main id="map" data-i18n-aria="map.aria"></main>

  <!-- Place picker: search plus the grouped list of places and neighbourhoods. -->
  <dialog id="picker" class="picker" aria-labelledby="pickerTitle">
    <div class="picker-head">
      <h2 id="pickerTitle"></h2>
      <form method="dialog"><button class="ghost icon" data-i18n-aria="picker.close"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button></form>
    </div>
    <label class="picker-search"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"/></svg><span class="sr-only" data-i18n="picker.search"></span>
      <input id="pickerInput" type="search" data-i18n-ph="picker.search" autocomplete="off" enterkeyhint="search" aria-controls="pickerList" aria-describedby="pickerCount" />
    </label>
    <p id="pickerCount" class="sr-only" aria-live="polite"></p>
    <div id="pickerList" class="picker-list"></div>
  </dialog>

  <dialog id="help" class="help" aria-labelledby="helpTitle">
    <div class="help-head">
      <h2 id="helpTitle" data-i18n="help.title"></h2>
      <form method="dialog"><button class="ghost icon" data-i18n-aria="help.closeAria"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button></form>
    </div>

    <section>
      <h3><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-route"/></svg> <span data-i18n="help.plan"></span></h3>
      <p data-i18n-html="help.plan.p1"></p>
      <p data-i18n-html="help.plan.p2"></p>
      <p data-i18n-html="help.plan.p3"></p>
    </section>

    <section>
      <h3><svg class="ic violet" aria-hidden="true" focusable="false"><use href="#i-palette"/></svg> <span data-i18n="help.colors"></span></h3>
      <ul class="help-legend">
        <li><i style="background:#1f9e6e"></i> <span data-i18n="help.c0"></span></li>
        <li><i style="background:#3b8bd4"></i> <span data-i18n="help.c2"></span></li>
        <li><i style="background:#f2a33a"></i> <span data-i18n="help.c4"></span></li>
        <li><i style="background:#e0523f"></i> <span data-i18n="help.c5"></span></li>
        <li><i class="dashed"></i> <span data-i18n="help.dashed"></span></li>
      </ul>
      <p><span class="dot-help" style="background:#f2a33a">!</span> <span data-i18n="help.soft"></span><br />
         <span class="dot-help" style="background:#e0523f">!</span> <span data-i18n="help.hard"></span></p>
    </section>

    <section>
      <h3><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-wind"/></svg> <span data-i18n="help.weather"></span></h3>
      <p data-i18n="help.weather.p"></p>
    </section>

    <section>
      <h3><svg class="ic coral" aria-hidden="true" focusable="false"><use href="#i-barrier"/></svg> <span data-i18n="help.blocked"></span></h3>
      <p data-i18n-html="help.blocked.p"></p>
    </section>

    <section>
      <h3><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-speaker"/></svg> <span data-i18n="help.onway"></span></h3>
      <p data-i18n-html="help.onway.p"></p>
    </section>

    <section id="installHelp">
      <h3><svg class="ic violet" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg> <span data-i18n="help.install"></span></h3>
      <p data-i18n="help.install.p"></p>
      <button type="button" id="installNow" hidden><svg class="ic white" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg> <span data-i18n="installNow"></span></button>
      <ol class="install-steps" data-os="ios">
        <li data-i18n-html="help.ios1"></li>
        <li data-i18n-html="help.ios2"></li>
      </ol>
      <ol class="install-steps" data-os="android">
        <li data-i18n-html="help.and1"></li>
        <li data-i18n-html="help.and2"></li>
      </ol>
    </section>

    <section>
      <h3><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-map"/></svg> <span data-i18n="help.offline"></span></h3>
      <ul class="offline-list">
        <li><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-check"/></svg> <span data-i18n="help.off1"></span></li>
        <li><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-check"/></svg> <span data-i18n="help.off2"></span></li>
        <li><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-info"/></svg> <span data-i18n="help.off3"></span></li>
        <li><svg class="ic sun" aria-hidden="true" focusable="false"><use href="#i-info"/></svg> <span data-i18n="help.off4"></span></li>
      </ul>
      <p data-i18n-html="help.offTip"></p>
    </section>

    <section>
      <h3><svg class="ic sky" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg> <span data-i18n="help.location"></span></h3>
      <p data-i18n-html="help.location.p"></p>
    </section>

    <section class="keys-only">
      <h3><svg class="ic teal" aria-hidden="true" focusable="false"><use href="#i-code"/></svg> <span data-i18n="help.keys"></span></h3>
      <dl class="keys">
        <dt><kbd>/</kbd></dt><dd data-i18n="key.slash"></dd>
        <dt><kbd>V</kbd></dt><dd data-i18n="key.v"></dd>
        <dt><kbd>O</kbd></dt><dd data-i18n="key.o"></dd>
        <dt><kbd>T</kbd></dt><dd data-i18n="key.t"></dd>
        <dt><kbd>B</kbd></dt><dd data-i18n="key.b"></dd>
        <dt><kbd>K</kbd></dt><dd data-i18n="key.k"></dd>
        <dt><kbd>?</kbd></dt><dd data-i18n="key.q"></dd>
        <dt><kbd>Esc</kbd></dt><dd data-i18n="key.esc"></dd>
      </dl>
      <label class="check"><input id="letterKeys" type="checkbox" checked /> <span data-i18n="letterKeys"></span></label>
    </section>

    <form method="dialog"><button class="help-close" data-i18n="help.close"></button></form>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
